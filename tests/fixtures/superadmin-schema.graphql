  What the connector reports about itself on check-in (its settings are made on its PC, never a password): {configured, syncing, sqlHost, database, table, columns, intervalMinutes, lastSyncAt, latestPunch, sentToday, driver, auth ...}; null until it reported once.
  """
  connectorStatus: JSONString

  """
  The location uses app check-in now, so Penquee has paused the connector.
  """
  paused: Boolean

  """"server · database · table" the connector reads; null until set up."""
  readsFrom: String

  """
