# Super-admin GraphQL schema of con-backend (the part of /graphql/ that the
# super-admin Query/Mutation classes serve). Generated by
# scripts/dump_superadmin_schema.py -- regenerate it after a backend schema
# change; tests/schema/graphql-documents.spec.ts and the mocked GraphQL layers
# (tests/fixtures/graphql.fixture.ts, component-tests/fixtures/schema-mocks.tsx)
# validate every operation against it.

type Query {
  adminAccountsReport(period: String!, year: Int!, month: Int, groupBy: String): AdminAccountsReportType

  """All SaaS tenant companies, optionally filtered."""
  adminCompanies(search: String, status: String, subscriptionStatus: String, dueDateFrom: DateTime, dueDateTo: DateTime, recurringDateFrom: DateTime, recurringDateTo: DateTime, limit: Int, offset: Int): [AdminCompanyType]

  """
  Package, interval, version and modules per company (at most 500 ids per call).
  """
  adminCompanyPackages(companyIds: [Int]!): [AdminCompanyPackage]
  adminCompanyPaymentHistory(companyId: Int!, dateFrom: DateTime, dateTo: DateTime, from: DateTime, to: DateTime, status: String, limit: Int, offset: Int): [AdminCompanyPaymentHistoryType]
  adminCurrencyRates(
    """Optional USD amount to convert per currency as a preview."""
    previewUsdCents: Int
  ): AdminCurrencyRates
  adminExpenseById(id: ID!): ExpenseType
  adminExpenses(filter: ExpenseFilterInput, sort: ExpenseSortInput): ExpenseFeedType
  adminInfrastructure(period: String = "all"): AdminInfrastructureType
  adminInfrastructureOverview(period: String = "all"): AdminInfrastructureOverviewType
  adminModuleDetail(moduleId: String!): AdminModuleDetailType

  """All packages/modules incl. inactive, with pricing and offer state."""
  adminModules(includeInactive: Boolean = true, search: String, active: Boolean, offerActive: Boolean, currency: String, priceMin: Int, priceMax: Int, limit: Int, offset: Int): [AdminModuleType]

  """All subscription payments, optionally filtered."""
  adminPayments(status: String, companyId: Int, dateFrom: DateTime, dateTo: DateTime, search: String, limit: Int, offset: Int): [AdminPaymentType]
  adminPlanDetail(id: String!): AdminPlan

  """Subscription plans used as billing source of truth."""
  adminPlans(includeInactive: Boolean = false, search: String, active: Boolean, limit: Int, offset: Int): [AdminPlan]

  """Promo codes used for paid registration plan checkout."""
  adminPromoCodes(includeInactive: Boolean = true, active: Boolean, search: String, planId: String, limit: Int, offset: Int): [AdminPromoCode]

  """Aggregate counts and revenue for dashboard cards."""
  adminRevenueSummary: AdminRevenueSummaryType
  adminUserActivityLogs(input: ActivityFilterInput, from: DateTime, to: DateTime, actor: String, action: String, companyId: Int, userId: ID, targetType: String, limit: Int, offset: Int): [AdminActivityLogType]

  """All users across tenants, optionally scoped/searched."""
  adminUsers(companyId: Int, search: String, limit: Int, offset: Int): [AdminUserType]
  companyPlan(companyId: Int!): AdminPlan

  """The SuperAdmin resolved from the X-SuperAdmin-Authorization header."""
  superAdminMe: SuperAdminType
}

