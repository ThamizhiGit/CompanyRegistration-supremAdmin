type Mutation {
  """
  Give companies on a package the package's CURRENT modules (after the
  package was edited). Interval, price, status and billing dates are kept.
  dryRun=true (the default) only reports what each company would gain/lose.
  """
  adminApplyPlanToSubscribers(
    dryRun: Boolean = true

    """
    The package version the admin previewed (planVersion of the dry run): applying is refused when the package was edited since.
    """
    expectedVersion: Int

    """
    Also move pre-package companies (full access today) onto the package's modules.
    """
    includeUnrestricted: Boolean = false

    """Only companies on an older package version."""
    onlyOutdated: Boolean = true
    planId: String!
    reason: String
  ): AdminApplyPlanToSubscribers

  """
  Move a company onto a package (private ones included). Its modules become the package's modules.
  """
  adminAssignCompanyPlan(
    """monthly | yearly; default: kept when staying on the package."""
    billingInterval: String
    companyId: Int!
    planId: String!
    reason: String
  ): AdminAssignCompanyPlan
  adminCreateExpense(input: ExpenseCreateInput!): AdminCreateExpense
  adminDeactivatePlan(id: String!, reason: String!): AdminSavePlanPayload
  adminDeactivatePromoCode(id: ID!, reason: String!): AdminSavePromoCodePayload

  """
  Delete a package/module by id. Optionally remove it from all tenant active module lists.
  """
  adminDeleteModule(
    """If true, remove this module from all companies before deleting."""
    force: Boolean = false

    """Stable module id to delete."""
    id: String!
  ): AdminDeleteModule
  adminDeletePlan(id: String!, reason: String!): AdminDeletePlan
  adminManualSubscriptionAction(companyId: Int!, gatewayPayload: GenericScalar, paymentMethod: String, reason: String, receiverMedium: String, senderMedium: String, source: String!, subscriptionId: String): AdminManualSubscriptionAction
  adminProcessManualSubscription(input: ManualSubscriptionInput!): AdminProcessManualSubscription

  """Refresh every non-pinned currency now from the rate source."""
  adminRefreshCurrencyRates: AdminRefreshCurrencyRates
  adminRefundPayment(input: PaymentRefundInput!): AdminRefundPayment
  adminRequestRefund(amount: BigInt, paymentIntentId: String!, reason: String!): AdminRequestRefund
  adminResumeCompany(companyId: Int!, reason: String!): AdminResumeCompany

  """
  Add or edit a customer currency. A hand-entered rate is pinned (the daily
  refresh keeps it) unless isManual=false is sent. USD is the base: its
  rate is always 1 and it cannot be switched off.
  """
  adminSaveCurrencyRate(
    active: Boolean
    code: String!

    """
    The admin confirmed a rate far (over 20%) from the current one, or switching on a placeholder (seed) rate.
    """
    confirmed: Boolean

    """Refuse instead of overwriting an existing currency (the Add form)."""
    createOnly: Boolean
    isManual: Boolean
    name: String

    """Units of this currency for 1 USD, e.g. '300.25'."""
    ratePerUsd: String
    roundTo: Int
    symbol: String
  ): AdminSaveCurrencyRate

  """
  Create or update a package/module (name, price, active, sort order, tree placement).
  """
  adminSaveModule(
    active: Boolean
    category: String
    currency: String
    dependsOn: [String]
    description: String
    icon: String

    """Stable key, e.g. 'employee_management'. Never rename an existing one."""
    id: String!
    name: String

    """Feature area this module is part of; '' makes it a feature area."""
    parentId: String

    """List price in cents."""
    price: BigInt
    sortOrder: Int
  ): AdminSaveModule
  adminSavePlan(input: AdminPlanInput!): AdminSavePlanPayload
  adminSavePromoCode(input: AdminPromoCodeInput!): AdminSavePromoCodePayload

  """
  Grant/revoke a tenant's active modules (validated against the catalog).
  """
  adminSetCompanyModules(
    companyId: Int!

    """
    Required to give a pre-package company (every module) an explicit list.
    """
    confirmLegacy: Boolean
    modules: [String]!
  ): AdminSetCompanyModules
  adminSetExpenseStatus(input: ExpenseStatusInput!): AdminSetExpenseStatus

  """Apply or clear an offer on a module. Pass `clear=True` to remove it."""
  adminSetModuleOffer(
    clear: Boolean = false
    id: String!
    offerEndsAt: DateTime
    offerLabel: String

    """Discounted price in cents."""
    offerPrice: BigInt
    offerStartsAt: DateTime
  ): AdminSetModuleOffer
  adminSuspendCompany(companyId: Int!, reason: String!, scope: String!, suspendedUntil: DateTime): AdminSuspendCompany
  adminUpdateCompanyDetail(input: CompanyUpdateInput!): AdminUpdateCompanyDetail
  adminUpdateCompanySubscription(input: CompanySubscriptionInput!): AdminUpdateCompanySubscription
  adminUpdateExpense(input: ExpenseUpdateInput!): AdminUpdateExpense

  """
  Reconcile a payment's status (e.g. mark 'refunded'). This updates the local
  record only — issuing the actual Stripe refund is a separate, deliberate
  step and is intentionally not wired here.
  """
  adminUpdatePaymentStatus(paymentIntentId: String!, reason: String, status: String!): AdminUpdatePaymentStatus
  adminUpdateUser(companyId: Int, email: String, firstName: String, input: UserUpdateInput, isActive: Boolean, isCompanyAdmin: Boolean, lastName: String, locationId: Int, userId: Int, username: String): AdminUpdateUser
  superAdminLogout: SuperAdminLogout
  superAdminTokenAuth(password: String!, username: String!): SuperAdminTokenAuth
}

