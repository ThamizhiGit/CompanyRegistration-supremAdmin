  """
  The connector PC's clock zone, e.g. 'UTC+03:00 (Arab Standard Time)'; null until reported.
  """
  pcClock: String

  """
  The PC's clock zone differs from the location's time zone (a warning only: punch times use the location's).
  """
  pcClockDiffers: Boolean
